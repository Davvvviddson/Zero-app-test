<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero</title>
<style>
:root{
  --bg:#08090c;--bg2:#0e1016;--bg3:#141720;
  --panel:rgba(255,255,255,.06);--stroke:rgba(255,255,255,.1);
  --stroke2:rgba(255,255,255,.18);
  --txt:#eef1f6;--dim:#98a1b1;--faint:#5c6574;
  --accent:#ff6a1f;--accent2:#ffa15c;--ink:#120700;
  --r:14px;--ease:cubic-bezier(.22,.68,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.5;color:var(--txt);
  background:radial-gradient(900px 600px at 10% -10%,#ff6a1f22,transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
}
header{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:0 14px;height:58px;border-bottom:1px solid var(--stroke);
  background:rgba(8,9,12,.82);backdrop-filter:blur(16px);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.dot{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,var(--accent) 60%,transparent 75%);box-shadow:0 0 14px var(--accent)}
.spacer{flex:1}
button{font-family:inherit;cursor:pointer}
.btn{
  height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--stroke);
  background:var(--panel);color:var(--txt);font-size:13.5px;font-weight:650;
  display:inline-flex;align-items:center;gap:6px;transition:transform .15s,background .15s;
}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--ink);border-color:transparent}
main{max-width:1200px;margin:0 auto;padding:18px 14px 90px}
.empty{text-align:center;padding:70px 20px;border:1px dashed var(--stroke2);border-radius:20px;background:var(--panel)}
.empty h2{margin:0 0 8px;font-size:20px}
.empty p{margin:0 auto 20px;max-width:400px;color:var(--dim);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{
  position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--stroke);
  background:var(--bg3);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;
}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.5);border-color:var(--stroke2)}
.thumb{
  aspect-ratio:2/3;background:center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;
  font-weight:750;font-size:15px;text-align:center;padding:14px;
  background:linear-gradient(150deg,#ff6a1f33,var(--bg3) 70%);
}
.name{
  position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.88));
  font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.type{
  position:absolute;top:8px;right:8px;font-size:11px;font-weight:750;
  background:rgba(0,0,0,.6);padding:3px 8px;border-radius:999px;
}
.modal-bg{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(0,0,0,.66);backdrop-filter:blur(8px);
}
.modal-bg.show{display:flex}
.modal{
  width:100%;max-width:460px;background:#12151c;border:1px solid var(--stroke2);
  border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.modal h2{margin:0 0 4px;font-size:20px}
.modal .hint{margin:0 0 18px;color:var(--dim);font-size:13px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.field input,.field select{
  width:100%;height:44px;border-radius:10px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);color:var(--txt);padding:0 13px;font:inherit;font-size:14px;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--accent)}
.err{color:#ff5c5c;font-size:12px;margin-top:5px;display:none}
.err.show{display:block}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;height:46px;border-radius:10px;font-weight:750;font-size:14px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--txt)}
.actions button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--ink);border-color:transparent}
.viewer{display:none}
.viewer.show{display:block}
.player{background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--stroke2)}
.player video,.player img{display:block;width:100%;max-height:75vh;object-fit:contain;background:#000}
.bar{
  display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;
  border-radius:var(--r);border:1px solid var(--stroke);background:var(--panel);
}
.bar .t{flex:1;min-width:0}
.bar .t .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t .s{font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
  z-index:100;padding:12px 20px;border-radius:999px;background:#1a1e27;border:1px solid var(--stroke2);
  font-size:13.5px;font-weight:650;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .btn .txt{display:none}
  .btn{padding:0;min-width:38px;justify-content:center}
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span>Zero</div>
  <div class="spacer"></div>
  <button class="btn primary" id="addBtn">＋<span class="txt">Add</span></button>
</header>

<main>
  <div id="libraryView">
    <div id="emptyState" class="empty" style="display:none">
      <h2>Your library is empty</h2>
      <p>Paste a direct media link — a video, image, or PDF — and Zero will display it. Zero hosts nothing; it only plays what you give it.</p>
      <button class="btn primary" id="emptyAdd">Add your first item</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="playerView" class="viewer">
    <div class="player" id="playerBox"></div>
    <div class="bar">
      <div class="t"><div class="n" id="pName">—</div><div class="s" id="pUrl"></div></div>
      <button class="btn" id="backBtn">Back</button>
    </div>
  </div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>Add to Zero</h2>
    <p class="hint">Direct media links play in the frame. Page links open in a new tab — most sites refuse to be embedded.</p>
    <div class="field">
      <label for="fName">Name</label>
      <input id="fName" type="text" placeholder="What is it?">
      <div class="err" id="eName"></div>
    </div>
    <div class="field">
      <label for="fUrl">URL</label>
      <input id="fUrl" type="url" placeholder="https://…/video.mp4" inputmode="url" autocomplete="off">
      <div class="err" id="eUrl"></div>
    </div>
    <div class="field">
      <label for="fType">Type</label>
      <select id="fType">
        <option value="auto">Auto-detect</option>
        <option value="video">Video</option>
        <option value="image">Image</option>
        <option value="pdf">PDF</option>
        <option value="page">Page (opens in new tab)</option>
      </select>
    </div>
    <div class="actions">
      <button id="cancelBtn">Cancel</button>
      <button class="primary" id="saveBtn">Add</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

var DB_NAME='zero', DB_VER=1, STORE='items';
var db=null;
var items=[];

function openDB(){
  return new Promise(function(res,rej){
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE,{keyPath:'id'});
      }
    };
    req.onsuccess=function(){ db=req.result; res(db); };
    req.onerror=function(){ rej(req.error); };
  });
}
function getAll(){
  return new Promise(function(res,rej){
    var r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();
    r.onsuccess=function(){ res(r.result||[]); };
    r.onerror=function(){ rej(r.error); };
  });
}
function put(item){
  return new Promise(function(res,rej){
    var r=db.transaction(STORE,'readwrite').objectStore(STORE).put(item);
    r.onsuccess=function(){ res(); };
    r.onerror=function(){ rej(r.error); };
  });
}

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

var toastTimer=null;
function toast(msg){
  var el=$('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('show'); },2200);
}

function looksVideo(u){ return /\.(mp4|webm|ogv|mov|m4v)(\?|#|$)/i.test(u); }
function looksImage(u){ return /\.(jpg|jpeg|png|gif|webp|avif|bmp|svg)(\?|#|$)/i.test(u); }
function looksPdf(u){ return /\.pdf(\?|#|$)/i.test(u); }

function detectType(url,chosen){
  if(chosen && chosen!=='auto') return chosen;
  if(looksVideo(url)) return 'video';
  if(looksImage(url)) return 'image';
  if(looksPdf(url)) return 'pdf';
  return 'page';
}

function renderLibrary(){
  var grid=$('grid');
  var empty=$('emptyState');

  if(items.length===0){
    grid.innerHTML='';
    empty.style.display='block';
    return;
  }
  empty.style.display='none';

  var sorted=items.slice().sort(function(a,b){ return (b.created||0)-(a.created||0); });
  var html='';
  for(var i=0;i<sorted.length;i++){
    var it=sorted[i];
    var badge = it.type==='video'?'▶':it.type==='image'?'🖼':it.type==='pdf'?'📄':'🌐';
    html += '<div class="card" data-id="'+esc(it.id)+'">'
          +   '<div class="thumb">'+esc(it.name)+'</div>'
          +   '<span class="type">'+badge+'</span>'
          +   '<div class="name">'+esc(it.name)+'</div>'
          + '</div>';
  }
  grid.innerHTML=html;

  var cards=grid.querySelectorAll('.card');
  for(var j=0;j<cards.length;j++){
    cards[j].addEventListener('click',function(){
      var id=this.getAttribute('data-id');
      openItem(id);
    });
  }
}

function openItem(id){
  var item=null;
  for(var i=0;i<items.length;i++){ if(items[i].id===id){ item=items[i]; break; } }
  if(!item) return;

  if(item.type==='page'){
    window.open(item.url,'_blank','noopener');
    toast('Opened in a new tab');
    return;
  }

  $('libraryView').style.display='none';
  $('playerView').classList.add('show');
  $('pName').textContent=item.name;
  $('pUrl').textContent=item.url;

  var box=$('playerBox');
  box.innerHTML='';

  if(item.type==='video'){
    var v=document.createElement('video');
    v.src=item.url;
    v.controls=true;
    v.playsInline=true;
    v.preload='metadata';
    box.appendChild(v);
  } else if(item.type==='image'){
    var img=document.createElement('img');
    img.src=item.url;
    img.alt=item.name;
    box.appendChild(img);
  } else if(item.type==='pdf'){
    var f=document.createElement('iframe');
    f.src=item.url;
    f.style.width='100%';
    f.style.height='75vh';
    f.style.border='none';
    box.appendChild(f);
  }

  item.lastOpened=Date.now();
  put(item).catch(function(){});
}

function showLibrary(){
  $('playerView').classList.remove('show');
  $('libraryView').style.display='block';
  var box=$('playerBox');
  var vids=box.querySelectorAll('video');
  for(var i=0;i<vids.length;i++){ try{ vids[i].pause(); }catch(e){} }
  box.innerHTML='';
  renderLibrary();
}

function openModal(){
  $('fName').value='';
  $('fUrl').value='';
  $('fType').value='auto';
  $('eName').textContent=''; $('eName').classList.remove('show');
  $('eUrl').textContent=''; $('eUrl').classList.remove('show');
  $('modalBg').classList.add('show');
  setTimeout(function(){ $('fName').focus(); },60);
}
function closeModal(){
  $('modalBg').classList.remove('show');
}

async function saveItem(){
  var name=$('fName').value.trim();
  var url=$('fUrl').value.trim();
  var chosen=$('fType').value;
  var ok=true;

  $('eName').textContent=''; $('eName').classList.remove('show');
  $('eUrl').textContent=''; $('eUrl').classList.remove('show');

  if(!name){
    $('eName').textContent='Give it a name.';
    $('eName').classList.add('show');
    ok=false;
  }

  var parsed=null;
  try{ parsed=new URL(url); }catch(e){ parsed=null; }

  if(!url){
    $('eUrl').textContent='Paste a URL.';
    $('eUrl').classList.add('show');
    ok=false;
  } else if(!parsed || !/^https?:$/.test(parsed.protocol)){
    $('eUrl').textContent='Needs to be a full http(s):// link.';
    $('eUrl').classList.add('show');
    ok=false;
  }

  if(!ok) return;

  var item={
    id:uid(),
    name:name,
    url:url,
    type:detectType(url,chosen),
    created:Date.now(),
    lastOpened:0
  };

  try{
    await put(item);
    items.push(item);
    closeModal();
    toast('Added "'+name+'"');
    renderLibrary();
  }catch(err){
    toast('Could not save. Storage may be blocked.');
    console.error(err);
  }
}

function boot(){
  openDB().then(function(){
    return getAll();
  }).then(function(list){
    items=list;
    renderLibrary();
    $('addBtn').addEventListener('click',openModal);
    $('emptyAdd').addEventListener('click',openModal);
    $('cancelBtn').addEventListener('click',closeModal);
    $('saveBtn').addEventListener('click',saveItem);
    $('backBtn').addEventListener('click',showLibrary);
    $('modalBg').addEventListener('click',function(e){
      if(e.target===$('modalBg')) closeModal();
    });
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape') closeModal();
    });
  }).catch(function(err){
    console.error('Boot failed',err);
    toast('Storage unavailable. Private mode may block IndexedDB.');
  });
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot);
} else {
  boot();
}
</script>
</body>
</html>
